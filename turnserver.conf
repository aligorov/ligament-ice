# ==============================================================================
# Ligament ICE (STUN / TURN) Server Configuration
# coturn production settings for Ligament 2FA WebRTC (Link / SOS Remote Desktop)
# ==============================================================================

# Слушающие порты
listening-port=3478
tls-listening-port=5349
alt-listening-port=0
alt-tls-listening-port=0

# Протокол и логи
fingerprint
lt-cred-mech
log-file=stdout
no-cli

# Диапазон портов для релея медиа-трафика WebRTC (UDP)
min-port=49152
max-port=49250

# Безопасность (Hardening):
# Запрет TCP-релея (RFC 6062) — только UDP WebRTC трафик, чтобы сервер не использовали как TCP-прокси
no-tcp-relay

# Защита от SSRF / сканирования внутренней сети через TURN:
# Запрещаем релеить трафик в локальные подсети хоста
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
