# ==============================================================================
# Ligament ICE (STUN / TURN) Server Configuration
# coturn production settings for Ligament 2FA WebRTC (Link / SOS Remote Desktop)
# ==============================================================================

# Слушающие порты (443 - основной для обхода блокировок TURNS TLS, 3478 - резерв STUN/TURN)
tls-listening-port=443
listening-port=3478
alt-listening-port=0
alt-tls-listening-port=5349

# Протокол и логи
fingerprint
lt-cred-mech
log-file=stdout
no-cli

# Параметры сокрытия и безопасности TLS
no-tlsv1
no-tlsv1_1
no-software-attribute
cipher-list="ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384"

# Диапазон портов для релея медиа-трафика WebRTC (UDP)
min-port=49152
max-port=49250

# Безопасность (Hardening):
# Запрет TCP-релея (RFC 6062) — только UDP WebRTC трафик, чтобы сервер не использовали как TCP-прокси.
# WebRTC (RFC 5766) использует UDP relay даже при подключении к TURN по TCP/TLS.
no-tcp-relay
allocation-lifetime=3600
stale-nonce=600

# Защита от SSRF / сканирования внутренней сети через TURN:
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
# Примечание: для звонков между пирами внутри корпоративного VPN/LAN (RFC 1918)
# данные диапазоны не блокируются на уровне релея, чтобы не дропать локальные сессии:
# denied-peer-ip=10.0.0.0-10.255.255.255
# denied-peer-ip=172.16.0.0-172.31.255.255
# denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff
